<main class="app-canvas">

  <!-- 1. Landing Screen (Active on initial load) -->
  <section class="app-landing" id="app-landing">
    <!-- Breathing animation container active on load -->
    <div class="breathe" aria-label="Calming breathing exercise"></div>
  </section>

  <!-- 2. Header (Hidden on landing, appears when step-1 starts) -->
  <header class="app-header" id="app-header" hidden>
    <div class="progress-container">
      <progress id="reset-progress" value="1" max="3" aria-label="Step progress"></progress>
    </div>
    <div class="countdown-watch" id="timer-display" aria-live="polite">0:10</div>
  </header>

  <!-- 3. Dynamic Step Sections Area -->
  <div class="app-body">

    <!-- STEP 1: Assessment / Triage -->
    <section class="step" id="step-1" hidden>
      <h4>I feel...</h4>
      <div class="button-group">
        <button type="button" class="btn-option" data-category="overworked">OVERWORKED</button>
        <button type="button" class="btn-option" data-category="disrespected">DISRESPECTED</button>
        <button type="button" class="btn-option" data-category="alone">ALONE</button>
      </div>

      <!-- Sub-options for OVERWORKED -->
      <div class="sub-panel" id="panel-overworked" hidden>
        <h4>Too much to...</h4>
        <label><input type="radio" name="stress-source" value="grade"> GRADE</label>
        <label><input type="radio" name="stress-source" value="plan"> PLAN</label>
        <label><input type="radio" name="stress-source" value="relax"> RELAX</label>
      </div>

      <!-- Sub-options for DISRESPECTED -->
      <div class="sub-panel" id="panel-disrespected" hidden>
        <h4>I'm upset at my...</h4>
        <label><input type="radio" name="respect" value="students-parents"> STUDENTS / PARENTS</label>
        <label><input type="radio" name="respect" value="administrators"> ADMINISTRATORS</label>
        <label><input type="radio" name="respect" value="own-failings"> OWN FAILINGS</label>
      </div>

      <!-- Sub-options for ALONE -->
      <div class="sub-panel" id="panel-alone" hidden>
        <h4>A word that describes what you're feeling:</h4>
        <input type="text" id="textbox-alone" placeholder="Type a word..." />
      </div>
    </section>

    <!-- STEP 2: Tailored Micro-Intervention -->
    <section class="step" id="step-2" hidden>
      <!-- Content dynamically injected based on stress-source / respect / textbox-alone -->
      <div id="tailored-activity-container"></div>
    </section>

    <!-- STEP 3: Humorous & Inspiring Closing -->
    <section class="step" id="step-3" hidden>
      <ul class="reflection-list">
        <li><strong>Teacher Humor:</strong> Random teacher joke snippet</li>
        <li><em>"You can't make this stuff up."</em> — A year from now, you'll look back & smile.</li>
        <li>Teaching is one of the few honorable professions left.</li>
      </ul>
    </section>

  </div>

  <!-- 4. Footer Bar -->
  <footer class="app-footer">
    <span class="brand-title">Erratic Enfants</span>
    <button id="btn-begin" type="button" class="reset-button">BEGIN</button>
    <img src="https://gravatar.com/userimage/11521900/d6bcfacd816d69a3e2a8c430d245de04.jpeg?size=32" alt="App Favicon" class="app-favicon" />
  </footer>

</main>
